<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>야광 · 손 인식과 조작</title>
<!--
  아이패드 쪽에 띄워 두는 화면 — 관람객용.
  손 인식 카메라를 화면 가득 깔고, 그 위 오른쪽에 조작판이 떠 있다 (정원의 안내 상자와 같은 어두운 유리).
  조작판은 장면마다 쓸 수 있는 버튼만 보인다. 작품 쪽에서 장면을 못 받으면 기본 버튼(방향 + 선택)을 띄운다.
  작품(index.html)은 모니터 쪽 사파리 창에, 이 화면은 아이패드 쪽 사파리 창에 연다.
  둘은 BroadcastChannel 로 이어진다 — 같은 사파리의 일반 창끼리만 된다.

  운영자용: 왼쪽 위 '작품과 연결됨'을 2초 누르고 있으면 카메라 위아래가 뒤집힌다.
-->
<style>
  @font-face { font-family: "Orbit"; src: url("assets/fonts/Orbit-Regular.woff2") format("woff2"); }
  :root {
    --acc: #9a5aff; --pink: #ff2bd6; --warm: #ffe2bd;
    --panel: rgba(10, 12, 15, 0.72); --line: rgba(255, 255, 255, 0.12); --dim: rgba(255, 255, 255, 0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Orbit", "Pretendard", -apple-system, system-ui, sans-serif; word-break: keep-all;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }

  /* ── 카메라 — 화면 가득 ── */
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .shade { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.45)); }

  .glass {
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .chips { position: fixed; display: flex; gap: 8px; flex-wrap: wrap;
    left: max(18px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top)); right: 420px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px; font-size: 16px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: #666; }
  .chip.on i { background: #3ee07a; box-shadow: 0 0 10px #3ee07a; }
  .chip.hand.on { border-color: rgba(154,90,255,.8); }
  .chip.hand.on i { background: var(--acc); box-shadow: 0 0 10px var(--acc); }
  .chip.pinch { display: none; }
  .chip.pinch.on { display: inline-flex; border-color: var(--pink); }
  .chip.pinch.on i { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  .chip.charging { background: rgba(154,90,255,.5); }

  .empty { position: fixed; left: 0; top: 0; bottom: 0; right: 400px; display: grid; place-content: center;
    text-align: center; gap: 10px; padding: 24px; font-size: 20px; line-height: 1.5; }
  .empty small { font-size: 15px; color: var(--dim); }
  .empty[hidden] { display: none; }

  /* ── 조작판 — 말랑한 젤리 버튼 (보라) ──
     어두운 자두색 유리 판 위에 통통한 젤리 버튼. 안쪽 테두리가 하얗게 빛나고, 바깥으로 같은 색 빛이 번진다.
     쓸 수 없는 버튼은 색이 빠진 납작한 회보라로. 십자키는 네 갈래가 따로 떨어진 모양. */
  .pad {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    top: 50%; transform: translateY(-50%);
    width: min(400px, calc(100vw - 40px));
    max-height: calc(100% - 40px);
    padding: 22px;
    border-radius: 36px;
    display: flex; flex-direction: column; gap: 18px;
    background: linear-gradient(170deg, rgba(46,36,60,.86), rgba(24,18,34,.9));
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.5);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
    font-family: "Roboto Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .18em;
    color: rgba(225,210,255,.55); }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: #4a405a; }
  .brand i.on { background: #c9a2ff; box-shadow: 0 0 10px #b48cff, 0 0 2px #fff inset; }

  .head { padding: 16px 18px; border-radius: 22px;
    background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: #efe4ff; }
  .head p { margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: rgba(225,210,255,.65); }

  button { font: inherit; color: #fff; border: 0; padding: 0; background: none;
    touch-action: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  [hidden] { display: none !important; }

  /* 젤리 — 공통 재질 */
  .jelly {
    --c1: #f3eaff; --c2: #d4b8ff; --c3: #b28aff; --glow: rgba(178,138,255,.55); --ink: #7b3fe6;
    background: radial-gradient(120% 100% at 50% 22%, var(--c1) 0%, var(--c2) 48%, var(--c3) 100%);
    box-shadow:
      inset 0 0 0 5px rgba(255,255,255,.42),
      inset 0 0 18px 6px rgba(255,255,255,.45),
      inset 0 -10px 18px rgba(110,50,200,.28),
      0 0 26px var(--glow),
      0 8px 18px rgba(20,6,40,.45);
    color: var(--ink);
    transition: transform .09s ease, box-shadow .12s ease, filter .12s ease, opacity .2s;
  }
  .jelly.down { transform: scale(.93);
    filter: saturate(1.25) brightness(1.06);
    box-shadow:
      inset 0 0 0 5px rgba(255,255,255,.55),
      inset 0 0 22px 8px rgba(255,255,255,.55),
      inset 0 -6px 14px rgba(110,50,200,.3),
      0 0 44px rgba(255,120,240,.75),
      0 4px 10px rgba(20,6,40,.45); }
  /* 쓸 수 없을 때 — 색이 빠진 납작한 회보라 (참고 이미지의 비활성 줄) */
  .jelly.off { pointer-events: none;
    background: #3a3446; color: #6d6680;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 2px 6px rgba(0,0,0,.25); }

  .ctrl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 4px 0 2px; }

  /* 십자키 — 네 갈래가 떨어져 있고, 바깥쪽이 둥글다 */
  .dpad { position: relative; width: 216px; height: 216px; display: grid; gap: 6px;
    grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .dpad button { display: grid; place-items: center; position: relative; }
  .dpad .k-up    { grid-area: 1 / 2; border-radius: 50% 50% 18px 18px / 46% 46% 18px 18px; }
  .dpad .k-down  { grid-area: 3 / 2; border-radius: 18px 18px 50% 50% / 18px 18px 46% 46%; }
  .dpad .k-left  { grid-area: 2 / 1; border-radius: 50% 18px 18px 50% / 46% 18px 18px 46%; }
  .dpad .k-right { grid-area: 2 / 3; border-radius: 18px 50% 50% 18px / 18px 46% 46% 18px; }
  .dpad .hub { grid-area: 2 / 2; align-self: center; justify-self: center; width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.12), rgba(0,0,0,.25)); }
  .dpad svg { width: 30px; height: 30px; fill: currentColor;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.7)) drop-shadow(0 0 6px rgba(255,255,255,.5)); }
  .dpad svg path { stroke: currentColor; stroke-width: 3.2; stroke-linejoin: round; }   /* 끝이 둥근 세모 */
  .dpad .lab { position: absolute; font-size: 12.5px; font-weight: 700; color: rgba(225,210,255,.75); white-space: nowrap; pointer-events: none; }
  .dpad .k-left .lab, .dpad .k-right .lab { top: calc(100% + 6px); }
  .dpad .k-up .lab, .dpad .k-down .lab { display: none; }
  .dpad .off .lab { opacity: 0; }

  /* 고르기 — 크고 진한 보라 젤리 */
  .abtn { display: grid; justify-items: center; }
  .k-sel { width: 124px; height: 124px; border-radius: 50%;
    --c1: #e2ccff; --c2: #a874ff; --c3: #7a3ee6; --glow: rgba(154,90,255,.7); --ink: #fff;
    font-size: 19px; font-weight: 800; letter-spacing: -.01em;
    text-shadow: 0 1px 0 rgba(80,20,160,.6), 0 0 10px rgba(255,255,255,.4); }

  /* 알약 버튼 — 시작·확인·다시 고르기·다음 영상으로 */
  .pill { display: block; width: 100%; min-height: 66px; padding: 14px 20px; border-radius: 999px;
    font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .pill.main { --c1: #e2ccff; --c2: #a874ff; --c3: #7a3ee6; --glow: rgba(154,90,255,.7); --ink: #fff;
    text-shadow: 0 1px 0 rgba(80,20,160,.6); }
  .pill.soft { --ink: #6a2fd6; }
  .pill.warm { --c1: #fff4e6; --c2: #ffd9ad; --c3: #ffb877; --glow: rgba(255,190,120,.55); --ink: #6b3a12; }
  .stack { display: flex; flex-direction: column; gap: 14px; }

  .film { display: grid; gap: 8px; text-align: center; padding: 22px 12px; border-radius: 22px;
    background: rgba(255,255,255,.05); font-size: 18px; line-height: 1.5; color: #efe4ff; }
  .film small { color: rgba(225,210,255,.65); font-size: 15px; }

  .coach {
    position: fixed; left: max(18px, env(safe-area-inset-left)); right: 440px; bottom: max(22px, env(safe-area-inset-bottom));
    margin: 0 auto; width: fit-content; max-width: calc(100% - 460px);
    display: flex; align-items: center; gap: 14px;
    padding: 16px 24px 16px 16px; border-radius: 18px;
    background: rgba(12, 8, 22, .78); border: 1px solid rgba(255, 79, 216, .55);
    box-shadow: 0 0 30px rgba(255, 43, 214, .25);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 22px; font-weight: 700; line-height: 1.4;
    animation: coachIn .35s cubic-bezier(.2,.9,.3,1);
  }
  .coach small { display: block; font-size: 16px; font-weight: 500; color: rgba(233,220,255,.75); }
  .coach__ic { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: #ff4fd8; color: #2a0a24; font-size: 22px; font-weight: 800; box-shadow: 0 0 14px #ff2bd6; }
  .coach.ok { border-color: rgba(62, 224, 122, .6); box-shadow: 0 0 30px rgba(62, 224, 122, .2); }
  .coach.ok .coach__ic { background: #3ee07a; color: #06240f; box-shadow: 0 0 14px #3ee07a; }
  @keyframes coachIn { from { opacity: 0; transform: translateY(10px); } }

  /* 세로로 세운 아이패드 — 조작판을 아래로 */
  @media (max-aspect-ratio: 1/1) {
    .pad { top: auto; bottom: max(20px, env(safe-area-inset-bottom)); transform: none; left: 50%; right: auto;
      margin-left: calc(min(380px, calc(100vw - 40px)) / -2); }
    .empty { right: 0; bottom: 50%; }
    .chips { right: 18px; }
    .coach { right: 18px; max-width: calc(100% - 36px); bottom: auto; top: 80px; }
    .shade { background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.45)); }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="shade"></div>

<div class="empty" id="empty">
  <b id="emptyT">작품 화면을 기다리는 중이에요</b>
  <small id="emptyS">같은 사파리의 다른 창에서 작품을 열어 두세요.<br />작품 쪽 카메라가 켜지면 여기 크게 보여요.</small>
</div>

<!-- 손 인식 안내 — 왜 잘 안 되는지 (너무 가까움·멂·어두움·화면 끝) -->
<div class="coach" id="coach" hidden><span class="coach__ic" id="coachIc">!</span><span id="coachText"></span></div>

<div class="chips">
  <span class="chip glass" id="link"><i></i><span id="linkText">연결 안 됨</span></span>
  <span class="chip glass hand" id="hand"><i></i><span id="handText">손을 카메라에 비춰 주세요</span></span>
  <span class="chip glass pinch" id="pinch"><i></i><span>집었어요</span></span>
</div>

<section class="pad" id="pad">
  <div class="brand"><span>YAGWANG · 夜光</span><i id="led"></i></div>
  <div class="head">
    <h1 id="title">조작하기</h1>
    <p id="hint">손으로 하거나, 아래 버튼을 눌러요.</p>
  </div>

  <!-- 시작 · 구슬 화면 -->
  <div class="stack" id="stack" hidden>
    <button class="pill jelly main" id="bMain" type="button">시작하기</button>
    <button class="pill jelly soft" id="bSub" type="button" hidden>다시 고르기</button>
  </div>

  <!-- 영상 -->
  <div class="film" id="film" hidden>
    <b>영상을 보고 있어요</b>
    <small>영상이 끝나면 저절로 넘어가요.</small>
  </div>

  <!-- 왼쪽 십자키 · 오른쪽 둥근 버튼 -->
  <div class="ctrl" id="ctrl">
    <div class="dpad" id="dpad">
      <button class="jelly k-up" data-key="up" type="button" aria-label="앞으로">
        <svg viewBox="0 0 24 24"><path d="M12 6l7 9H5z"/></svg><span class="lab">앞으로</span></button>
      <button class="jelly k-left" data-key="left" type="button" aria-label="왼쪽">
        <svg viewBox="0 0 24 24"><path d="M6 12l9-7v14z"/></svg><span class="lab" id="labL">왼쪽</span></button>
      <button class="jelly k-right" data-key="right" type="button" aria-label="오른쪽">
        <svg viewBox="0 0 24 24"><path d="M18 12l-9 7V5z"/></svg><span class="lab" id="labR">오른쪽</span></button>
      <button class="jelly k-down" data-key="down" type="button" aria-label="뒤로">
        <svg viewBox="0 0 24 24"><path d="M12 18l-7-9h14z"/></svg><span class="lab">뒤로</span></button>
      <span class="hub"></span>
    </div>
    <div class="abtn">
      <button class="jelly k-sel" id="bSel" type="button"><span id="selText">선택</span></button>
    </div>
  </div>

  <button class="pill jelly warm" id="bNext" type="button" hidden>다음 영상으로 →</button>
</section>

<script>
const ch = new BroadcastChannel("yk-monitor");
const cv = document.getElementById("view");
const g = cv.getContext("2d");
const $ = (id) => document.getElementById(id);

let frame = null, frameW = 4, frameH = 3;     // 마지막 카메라 그림
let state = null, ui = null, lastMsg = 0, uiAt = 0;
let shownHand = null;                         // 화면에 그리는 손 — 받은 손을 부드럽게 따라간다

ch.onmessage = async (e) => {
  const m = e.data || {};
  lastMsg = performance.now();
  if (m.t === "frame" && m.blob) {
    try {
      const bmp = await createImageBitmap(m.blob);
      if (frame && frame.close) frame.close();
      frame = bmp; frameW = m.w; frameH = m.h;
    } catch {}
  } else if (m.t === "hand") state = m;
  else if (m.t === "ui") { ui = m; uiAt = performance.now(); layout(); }
};

// 작품 쪽에 '여기 화면이 있다'고 알린다 — 그래야 그림을 보내기 시작한다
const hello = () => ch.postMessage({ t: "hello" });
hello(); setInterval(hello, 1000);

// 아이패드 화면이 꺼지지 않게
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {} }
keepAwake();
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

// 두 번 눌러 확대·길게 눌러 메뉴 같은 아이패드 기본 동작을 막는다
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ── 방향키 — 누르고 있는 동안 움직인다 ── */
const held = new Set();
const sendPad = () => ch.postMessage({ t: "pad", keys: [...held] });
setInterval(() => { if (held.size) sendPad(); }, 400);     // 놓는 신호를 놓쳐도 작품 쪽이 알아서 멈추게
document.querySelectorAll("[data-key]").forEach((b) => {
  const k = b.dataset.key;
  const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} held.add(k); b.classList.add("down"); sendPad(); };
  const off = () => { if (!held.has(k)) return; held.delete(k); b.classList.remove("down"); sendPad(); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("lostpointercapture", off);
});
// 한 번 누르면 되는 버튼 — 손가락이 닿는 순간 반응한다
function tap(el, fn) {
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.classList.add("down"); fn(); });
  const up = () => el.classList.remove("down");
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
}
tap($("bSel"), () => ch.postMessage({ t: "select" }));
tap($("bMain"), () => ch.postMessage({ t: "select" }));
tap($("bSub"), () => { ch.postMessage({ t: "pad", keys: ["left"] }); setTimeout(() => ch.postMessage({ t: "pad", keys: [] }), 150); });
tap($("bNext"), () => ch.postMessage({ t: "next" }));

/* 운영자용 — '작품과 연결됨'을 2초 누르면 카메라 위아래 뒤집기 */
{
  const el = $("link"); let t = 0;
  el.addEventListener("pointerdown", () => { el.classList.add("charging"); t = setTimeout(() => { ch.postMessage({ t: "rotate" }); el.classList.remove("charging"); }, 2000); });
  const cancel = () => { clearTimeout(t); el.classList.remove("charging"); };
  el.addEventListener("pointerup", cancel); el.addEventListener("pointercancel", cancel); el.addEventListener("pointerleave", cancel);
}

/* ── 장면마다 보이는 버튼 ──
   작품에서 장면을 못 받고 있으면(예전 작품 화면 등) 'any' — 방향 네 개 + 선택을 다 띄운다. */
const COPY = {
  any:    ["조작하기", "손으로 하거나, 아래 버튼을 눌러요."],
  boot:   ["시작하기", "손을 카메라에 비추거나, 아래 버튼을 눌러요."],
  grid:   ["파편 고르기", "◀ ▶ 로 고리를 돌리고, 가운데 파편이 마음에 들면 ‘고르기’를 눌러요."],
  orb:    ["구슬이 되었어요", "보관된 감각을 확인하러 가거나, 다시 고를 수 있어요."],
  film:   ["영상", ""],
  garden: ["구슬빛 정원", "◀ ▶ 로 둘러보고 ▲ ▼ 로 걸어요. 가운데 버튼으로 앞에 보이는 구슬을 열어요."],
};
let shown = "";
function layout() {
  const sc = ui && performance.now() - uiAt < 1500 ? ui.scene : "any";
  const key = sc + "|" + (ui && ui.canNext) + "|" + (ui && ui.reading);
  if (key === shown) return;
  shown = key;
  const [title, hint] = COPY[sc] || COPY.any;
  $("title").textContent = title;
  $("hint").textContent = hint;
  $("hint").hidden = !hint;

  const dpad = sc === "grid" || sc === "garden" || sc === "any";
  $("ctrl").hidden = !dpad;
  $("stack").hidden = !(sc === "boot" || sc === "orb");
  $("film").hidden = sc !== "film";
  $("bNext").hidden = !(sc === "garden" && ui && ui.canNext);

  // 아카이브는 좌우만, 정원은 네 방향
  const ud = sc === "garden" || sc === "any";
  document.querySelector(".k-up").classList.toggle("off", !ud);
  document.querySelector(".k-down").classList.toggle("off", !ud);
  $("labL").textContent = sc === "garden" ? "왼쪽 보기" : sc === "grid" ? "돌리기" : "왼쪽";
  $("labR").textContent = sc === "garden" ? "오른쪽 보기" : sc === "grid" ? "돌리기" : "오른쪽";
  $("selText").textContent = sc === "garden" ? (ui && ui.reading ? "닫기" : "구슬 열기") : sc === "grid" ? "고르기" : "선택";

  if (sc === "boot") { $("bMain").textContent = "시작하기"; $("bSub").hidden = true; }
  if (sc === "orb") { $("bMain").textContent = "확인하러 가기"; $("bSub").hidden = false; }

  // 장면이 바뀌면 누르고 있던 방향은 놓는다
  if (held.size) { held.clear(); document.querySelectorAll("[data-key].down").forEach((b) => b.classList.remove("down")); sendPad(); }
}
setInterval(layout, 400);
layout();

/* ── 카메라 + 손 그리기 ── */
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function draw() {
  requestAnimationFrame(draw);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  g.clearRect(0, 0, W, H);

  const live = performance.now() - lastMsg < 2000;
  $("link").classList.toggle("on", live);
  $("led").classList.toggle("on", live);
  $("linkText").textContent = live ? "작품과 연결됨" : "연결 안 됨";
  $("empty").hidden = live && !!frame;
  if (live && !frame) { $("emptyT").textContent = "카메라를 켜는 중이에요"; $("emptyS").textContent = "조금만 기다려 주세요. 오른쪽 버튼으로도 조작할 수 있어요."; }
  if (!frame) return;

  // 카메라 그림을 화면 가득 (넘치는 가장자리는 잘린다) — 거울처럼 좌우를 뒤집는다
  const s = Math.max(W / frameW, H / frameH);
  const dw = frameW * s, dh = frameH * s, dx = (W - dw) / 2, dy = (H - dh) / 2;
  g.save();
  g.translate(W, 0); g.scale(-1, 1);
  g.drawImage(frame, W - dx - dw, dy, dw, dh);
  g.restore();
  if (!live) { g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(0, 0, W, H); }

  const st = state || {};
  const hand = live ? st.hand : null;
  showCoach(live ? st.coach : null);
  $("hand").classList.toggle("on", !!hand);
  $("handText").textContent = hand ? "손을 찾았어요" : "손을 카메라에 비춰 주세요";
  $("pinch").classList.toggle("on", !!(hand && st.pinch));
  if (!hand) { shownHand = null; return; }

  // 받은 손으로 부드럽게 다가간다 — 손 좌표는 초당 15~30번 오지만 화면은 60~120번 그리므로
  if (!shownHand) shownHand = hand.map((p) => p.slice());
  else for (let i = 0; i < hand.length; i++) {
    shownHand[i][0] += (hand[i][0] - shownHand[i][0]) * 0.5;
    shownHand[i][1] += (hand[i][1] - shownHand[i][1]) * 0.5;
  }
  const hp = shownHand;

  const P = (p) => ({ x: dx + (1 - p[0]) * dw, y: dy + p[1] * dh });
  const k = Math.min(dw, dh * 4 / 3) / 600;
  {
    const a = P(hp[4]), b = P(hp[8]);
    g.save();
    g.strokeStyle = st.pinch ? "#ff2bd6" : "rgba(255,255,255,.45)";
    g.lineWidth = (st.pinch ? 6 : 2) * k;
    if (!st.pinch) g.setLineDash([6 * k, 6 * k]);
    else { g.shadowColor = "#ff2bd6"; g.shadowBlur = 18 * k; }
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    g.restore();
  }
  g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2.5 * k;
  for (const [a, b] of CONN) { const p = P(hp[a]), q = P(hp[b]); g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke(); }
  g.fillStyle = "rgba(255,255,255,.85)";
  for (const p0 of hp) { const p = P(p0); g.beginPath(); g.arc(p.x, p.y, 3 * k, 0, Math.PI * 2); g.fill(); }
  for (const i of [4, 8, 12, 16, 20]) {
    const p = P(hp[i]), big = i === 8, r = (big ? 10 : 6) * k;
    g.save(); g.shadowColor = "rgba(154,90,255,.95)"; g.shadowBlur = (big ? 24 : 12) * k;
    g.fillStyle = big ? "#9a5aff" : "#b48cff"; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill(); g.restore();
  }
  if (st.gauge > 0) {
    const p = P(hp[8]), r = 26 * k;
    g.lineWidth = 6 * k;
    g.strokeStyle = "rgba(255,255,255,.2)";
    g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = "#ff2bd6";
    g.beginPath(); g.arc(p.x, p.y, r, -Math.PI / 2, -Math.PI / 2 + st.gauge * Math.PI * 2); g.stroke();
  }
}
draw();

/* 안내 — 작품 쪽이 손 크기·위치·밝기를 보고 고른 말 (main.js coachFor). 같은 말이면 다시 그리지 않는다 */
let coachShown = "";
function showCoach(c) {
  const key = c ? c.kind + c.text : "";
  if (key === coachShown) return;
  coachShown = key;
  $("coach").hidden = !c;
  if (!c) return;
  $("coach").classList.toggle("ok", c.kind === "ok");
  $("coachIc").textContent = c.kind === "ok" ? "✓" : "!";
  $("coachText").innerHTML = c.text + (c.sub ? "<small>" + c.sub + "</small>" : "");
}
</script>
