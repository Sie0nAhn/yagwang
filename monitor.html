<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>야광 · 손 인식과 조작</title>
<!--
  아이패드 쪽에 띄워 두는 화면 — 관람객용. 배치는 피그마 '영상캡스톤' iPad Pro 12.9" 화면(1123:9)을 따른다.
    위: 둥근 카메라 칸 (손 인식이 보는 비율 그대로, 남는 곳은 검정) — 왼쪽 위에 연결·손 상태, 오른쪽 아래에 손 인식 안내
    아래 왼쪽: 글 안내 · 아래 가운데: 십자 버튼 · 아래 오른쪽: 큰 버튼
  버튼은 참고 이미지(말랑한 젤리 버튼 + 꽉 찬 알약)를 그대로, 색만 작품에 맞게.
  작품(index.html)은 모니터 쪽 사파리 창에, 이 화면은 아이패드 쪽 사파리 창에 연다.
  둘은 BroadcastChannel 로 이어진다 — 같은 사파리의 일반 창끼리만 된다.

  운영자용: 카메라 칸 왼쪽 위 '작품과 연결됨'을 2초 누르고 있으면 카메라 위아래가 뒤집힌다.
-->
<style>
  @font-face { font-family: "Orbit"; src: url("assets/fonts/Orbit-Regular.woff2") format("woff2"); }
  :root {
    --bg: #000;              /* 검정 — 작품 화면(모니터)과 같은 바탕 */
    --pill: #9a5aff;         /* 참고 이미지의 파란 FILTER 자리 — 작품의 보라 (style.css --boot · 타이틀 도장 夜光) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden;
    font-family: "Orbit", "Pretendard", -apple-system, system-ui, sans-serif; word-break: keep-all;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: 0; padding: 0; background: none;
    touch-action: none; cursor: pointer; -webkit-appearance: none; appearance: none; }

  /* ── 전체 배치 — 카메라 칸과 아래 줄이 같은 폭으로, 위아래·양옆 여백이 같게 ──
     카메라 칸은 카메라 비율(--arn, 보통 4:3) 그대로라 검은 띠가 생기지 않는다. 아래 줄은 카메라 칸 양끝에 맞춘다. */
  :root {
    --m: 44px;          /* 바깥 여백 (위·아래·양옆) */
    --gap: 30px;        /* 카메라 칸과 아래 줄 사이 */
    --pad-h: 216px;     /* 아래 줄 높이 = 십자 버튼 높이 */
    --arn: 1.3333;      /* 카메라 가로÷세로 — 그림이 오면 맞춘다 */
    --w: min(calc((100dvh - 2 * var(--m) - var(--gap) - var(--pad-h)) * var(--arn)), calc(100vw - 2 * var(--m)));
  }
  .col { position: fixed; inset: 0; padding: var(--m);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); }

  /* ── 카메라 칸 ── */
  .cam {
    position: relative; flex: none;
    width: var(--w); aspect-ratio: var(--arn);
    border-radius: 36px; overflow: hidden;
    background: #0d0a14;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);   /* 검정 바탕에서 칸이 보이게 */
  }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 카메라 칸 안쪽 여백 — 위·아래·양옆 모두 같게 (상태 알약은 왼쪽 위, 손 인식 안내는 오른쪽 아래) */
  .cam { --in: 24px; }
  .chips { position: absolute; left: var(--in); top: var(--in); right: var(--in); display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
    font-size: 15px; font-weight: 700; color: #fff; background: rgba(255, 255, 255, .16);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .chip.on i { background: #3ee07a; }
  .chip.hand.on { background: rgba(154, 90, 255, .7); }
  .chip.hand.on i { background: #d4b8ff; }
  .chip.pinch { display: none; }
  .chip.pinch.on { display: inline-flex; background: rgba(255, 43, 214, .6); }
  .chip.pinch.on i { background: #fff; }
  .chip.charging { background: rgba(255, 63, 200, .7); }

  .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
    padding: 24px; font-size: 20px; line-height: 1.5; }
  .empty small { font-size: 15px; color: rgba(255,255,255,.65); }

  /* 손 인식 안내 — 카메라 칸 오른쪽 아래 (x626 y556, 488×105) */
  .coach {
    position: absolute; right: var(--in); bottom: var(--in); width: auto; max-width: calc(100% - 2 * var(--in));
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px 12px 12px; border-radius: 18px;
    background: rgba(20, 0, 50, .72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 17px; font-weight: 800; line-height: 1.35;
    animation: coachIn .35s cubic-bezier(.2,.9,.3,1);
  }
  .coach small { display: block; margin-top: 1px; font-size: 13px; font-weight: 500; color: rgba(240, 228, 255, .8); }
  .coach__ic { flex: none; width: 34px; height: 34px; border-radius: 32%; display: grid; place-items: center;
    background: #ffd6f7; color: #ff4fc3; font-size: 18px; font-weight: 800;
    box-shadow: inset 0 0 8px 2px rgba(255,255,255,.8); }
  .coach.ok .coach__ic { background: #d9f7b0; color: #4da82a; }
  @keyframes coachIn { from { opacity: 0; transform: translateY(10px); } }

  /* ── 아래 줄 — 왼쪽 글 · 가운데 십자 · 오른쪽 큰 버튼 ── */
  .pad {
    position: relative; flex: none;
    width: var(--w); height: var(--pad-h);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 36px;
    align-items: start;    /* 글은 위로 */
  }
  .pad .dpad { align-self: end; }   /* 버튼은 아래로 */

  /* 글 — 짧게 세 줄: 제목 · 할 일 · 버튼 안내 */
  .say { padding-left: 6px; align-self: start; }
  .say h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
  .say p { white-space: pre-line; margin: 10px 0 0; font-size: 17px; line-height: 1.45; color: rgba(255,255,255,.92); }
  .say .tip { margin-top: 6px; font-size: 14px; font-weight: 700; color: rgba(228, 210, 255, .85); }

  /* 영상 진행 막대 */
  .prog { margin-top: 18px; max-width: 520px; }
  .prog__bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
  .prog__bar i { display: block; height: 100%; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, #9a5aff, #ff2bd6); transition: width .25s linear; }
  .say .prog__time { margin: 10px 0 0; font-size: 20px;
    color: rgba(255,255,255,.7); letter-spacing: .02em; }
  .prog__time b { color: #fff; font-weight: 700; }

  /* 오른쪽 — 큰 버튼 (정원에서 기억을 읽으면 위에 '다음 영상으로'가 붙는다) */
  .acts { display: flex; flex-direction: column; gap: 10px; }

  /* 젤리 — 참고 이미지 그대로: 연한 몸통 · 가장자리 안쪽 하얀 빛 · 아래쪽만 살짝 진하게.
     아이콘은 같은 색 진하게, 둘레로 연한 같은 색 빛 */
  .jelly {
    display: grid; place-items: center;
    border-radius: 30%;
    background: var(--body);
    box-shadow:
      inset 0 0 10px 3px rgba(255, 255, 255, .8),
      inset 0 -9px 14px -6px var(--deep);
    color: var(--ink);
    transition: transform .1s ease, box-shadow .15s ease;
  }
  .jelly svg { width: 32px; height: 32px; fill: currentColor;
    filter: drop-shadow(0 0 3px var(--soft)) drop-shadow(0 0 8px var(--soft)); }
  .jelly svg path { stroke: currentColor; stroke-width: 3.4; stroke-linejoin: round; stroke-linecap: round; }
  .jelly.down { transform: scale(.92); box-shadow: inset 0 0 14px 5px rgba(255,255,255,.92), inset 0 -6px 12px -6px var(--deep); }
  .c-pink   { --body: #ffd6f7; --deep: rgba(255, 120, 210, .5); --ink: #ff4fc3; --soft: #ffadea; }
  .c-lav    { --body: #e8d8ff; --deep: rgba(168, 118, 255, .5); --ink: #8b3dff; --soft: #c9a8ff; }
  .c-peri   { --body: #dcdfff; --deep: rgba(120, 128, 255, .5); --ink: #5a5cff; --soft: #aeb2ff; }
  .c-orchid { --body: #f4d9ff; --deep: rgba(200, 110, 255, .5); --ink: #b63dff; --soft: #e2a8ff; }
  .c-sun    { --body: #ffe58c; --deep: rgba(255, 196, 70, .6); --ink: #f08a00; --soft: #fff0b8; }
  /* 쓸 수 없을 때 — 참고 이미지 아래 줄처럼 색이 빠진 연회색 */
  .jelly.off { pointer-events: none;
    --body: #d9e1ea; --ink: #b5c9de; --soft: transparent;
    box-shadow: inset 0 4px 8px -2px rgba(120, 140, 170, .3); }

  /* 십자 — 가운데는 비워 둔다 */
  /* 버튼 판 — 십자 3칸 + 띄움 + 오른쪽 열. 모든 버튼이 같은 66px 줄에 맞춰 선다 */
  .dpad { display: grid; gap: 9px; grid-template-columns: repeat(3, 66px) 10px 200px; grid-template-rows: repeat(3, 66px); }
  .dpad .jelly { width: 66px; height: 66px; }
  .dpad svg { width: 28px; height: 28px; }
  .dpad .k-up    { grid-area: 1 / 2; }
  .dpad .k-left  { grid-area: 2 / 1; }
  .dpad .k-right { grid-area: 2 / 3; }
  .dpad .k-down  { grid-area: 3 / 2; }

  /* 큰 버튼 — 참고 이미지의 FILTER: 꽉 찬 색, 그림자 없이. 가운데 줄 (← → 와 같은 높이) */
  /* 고르기·구슬 열기는 언제나 ◀ ▶ 와 같은 가운데 줄. '다음 영상으로'는 그 아래 (▼ 옆) */
  .act { grid-area: 2 / 5; width: 200px; height: 66px; border-radius: 999px; background: var(--pill); color: #fff;
    font-size: 18px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap;
    transition: transform .1s ease, background .15s ease; }
  .act.down { transform: scale(.96); background: #8443f2; }

  /* 다음 영상으로 — 노란 젤리 알약 (정원에서 기억을 읽은 뒤) */
  /* 다음 영상으로 — 고르기와 같은 크기, 바로 아랫줄 */
  .dpad .pill, .pill { grid-area: 3 / 5; display: block; width: 200px; height: 66px; border-radius: 999px;
    font-size: 18px; font-weight: 800; }
</style>
</head>
<body>

<main class="col">
<section class="cam">
  <canvas id="view"></canvas>
  <div class="empty" id="empty">
    <b id="emptyT">작품 화면을 기다리는 중이에요</b>
    <small id="emptyS">같은 사파리의 다른 창에서 작품을 열어 두세요.<br />작품 쪽 카메라가 켜지면 여기 크게 보여요.</small>
  </div>
  <div class="chips">
    <span class="chip" id="link"><i></i><span id="linkText">연결 안 됨</span></span>
    <span class="chip hand" id="hand"><i></i><span id="handText">손을 카메라에 비춰 주세요</span></span>
    <span class="chip pinch" id="pinch"><i></i><span>집었어요</span></span>
  </div>
  <!-- 손 인식 안내 — 왜 잘 안 되는지 (너무 가까움·멂·어두움·화면 끝) -->
  <div class="coach" id="coach" hidden><span class="coach__ic" id="coachIc">!</span><span id="coachText"></span></div>
</section>

<section class="pad" id="pad">
  <div class="say">
    <h1 id="title">조작하기</h1>
    <p id="hint">손으로, 또는 버튼으로</p>
    <p class="tip" id="tip">손이 잘 안 되면 버튼을 눌러 보세요</p>
    <!-- 영상이 나오는 동안 — 지금 보는 영상 이름 · 얼마나 봤는지 · 전체 길이 -->
    <div class="prog" id="prog" hidden>
      <p class="prog__time"><b id="progNow">0초</b> / <span id="progDur">0초</span></p>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <button class="jelly c-lav k-up" data-key="up" type="button" aria-label="앞으로">
      <svg viewBox="0 0 24 24"><path d="M12 6l7 9H5z"/></svg></button>
    <button class="jelly c-pink k-left" data-key="left" type="button" aria-label="왼쪽">
      <svg viewBox="0 0 24 24"><path d="M6 12l9-7v14z"/></svg></button>
    <button class="jelly c-orchid k-right" data-key="right" type="button" aria-label="오른쪽">
      <svg viewBox="0 0 24 24"><path d="M18 12l-9 7V5z"/></svg></button>
    <button class="jelly c-peri k-down" data-key="down" type="button" aria-label="뒤로">
      <svg viewBox="0 0 24 24"><path d="M12 18l-7-9h14z"/></svg></button>
    <!-- 오른쪽 열 — 아래로 맞춘다: 맨 아랫줄 '고르기', 그 위 '다음 영상으로' -->
    <button class="pill jelly c-sun" id="bNext" type="button" hidden>다음 영상으로</button>
    <button class="act" id="bSel" type="button"><span id="selText">선택</span></button>
  </div>
</section>
</main>

<script>
const ch = new BroadcastChannel("yk-monitor");
const cv = document.getElementById("view");
const g = cv.getContext("2d");
const $ = (id) => document.getElementById(id);

let frame = null, frameW = 4, frameH = 3;     // 마지막 카메라 그림
let state = null, ui = null, lastMsg = 0, uiAt = 0;
let shownHand = null;                         // 화면에 그리는 손 — 받은 손을 부드럽게 따라간다

ch.onmessage = async (e) => {
  const m = e.data || {};
  lastMsg = performance.now();
  if (m.t === "frame" && m.blob) {
    try {
      const bmp = await createImageBitmap(m.blob);
      if (frame && frame.close) frame.close();
      frame = bmp;
      if (m.w !== frameW || m.h !== frameH) document.documentElement.style.setProperty("--arn", (m.w / m.h).toFixed(4));
      frameW = m.w; frameH = m.h;
    } catch {}
  } else if (m.t === "hand") state = m;
  else if (m.t === "ui") { ui = m; uiAt = performance.now(); layout(); showFilm(m.film); }
};

// 작품 쪽에 '여기 화면이 있다'고 알린다 — 그래야 그림을 보내기 시작한다
const hello = () => ch.postMessage({ t: "hello" });
hello(); setInterval(hello, 1000);

// 아이패드 화면이 꺼지지 않게
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {} }
keepAwake();
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

// 두 번 눌러 확대·길게 눌러 메뉴 같은 아이패드 기본 동작을 막는다
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ── 방향키 — 누르고 있는 동안 움직인다 ──
   구슬 화면에서는 ◀ 가 '다시 고르기' (작품 쪽이 구슬 화면의 ◀ 를 그렇게 받는다) */
const held = new Set();
const sendPad = () => ch.postMessage({ t: "pad", keys: [...held] });
setInterval(() => { if (held.size) sendPad(); }, 400);     // 놓는 신호를 놓쳐도 작품 쪽이 알아서 멈추게
document.querySelectorAll("[data-key]").forEach((b) => {
  const k = b.dataset.key;
  const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} held.add(k); b.classList.add("down"); sendPad(); };
  const off = () => { if (!held.has(k)) return; held.delete(k); b.classList.remove("down"); sendPad(); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("lostpointercapture", off);
});
// 한 번 누르면 되는 버튼 — 손가락이 닿는 순간 반응한다
function tap(el, fn) {
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.classList.add("down"); fn(); });
  const up = () => el.classList.remove("down");
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
}
tap($("bSel"), () => ch.postMessage({ t: "select" }));
tap($("bNext"), () => ch.postMessage({ t: "next" }));

/* 운영자용 — '작품과 연결됨'을 2초 누르면 카메라 위아래 뒤집기 */
{
  const el = $("link"); let t = 0;
  el.addEventListener("pointerdown", () => { el.classList.add("charging"); t = setTimeout(() => { ch.postMessage({ t: "rotate" }); el.classList.remove("charging"); }, 2000); });
  const cancel = () => { clearTimeout(t); el.classList.remove("charging"); };
  el.addEventListener("pointerup", cancel); el.addEventListener("pointercancel", cancel); el.addEventListener("pointerleave", cancel);
}

/* ── 장면마다 글과 버튼 ──
   작품에서 장면을 못 받고 있으면(예전 작품 화면 등) 'any' — 방향 네 개 + 선택을 다 켠다. */
const COPY = {
  any:    ["조작하기", "손으로, 또는 버튼으로"],
  boot:   ["시작하기", "손을 비추거나 ‘시작하기’"],
  grid:   ["파편 고르기", "◀ ▶ 돌리기 · 마음에 들면 ‘고르기’"],
  orb:    ["구슬이 되었어요", "‘확인하러 가기’ · ◀ 다시 고르기"],
  film:   ["영상 보는 중", ""],
  garden: ["구슬빛 정원", "◀ ▶ 둘러보기 · ▲ ▼ 걷기\n고리가 뜬 구슬이 열려요"],
};
const ON = {
  any: ["left", "up", "down", "right"],
  boot: [],
  grid: ["left", "right"],
  orb: ["left"],
  film: [],
  garden: ["left", "up", "down", "right"],
};
let shown = "";
function layout() {
  const sc = ui && performance.now() - uiAt < 1500 ? ui.scene : "any";
  const key = sc + "|" + (ui && ui.canNext) + "|" + (ui && ui.reading) + "|" + (ui && ui.same);
  if (key === shown) return;
  shown = key;
  const [title, hint] = COPY[sc] || COPY.any;
  $("title").textContent = title;
  $("hint").textContent = hint;
  $("hint").hidden = !hint;

  // 쓸 수 없는 방향은 연회색 (참고 이미지의 비활성 줄)
  const on = ON[sc] || ON.any;
  for (const k of ["left", "up", "down", "right"]) document.querySelector(".k-" + k).classList.toggle("off", !on.includes(k));

  $("tip").hidden = sc === "film" || sc === "boot";
  $("bNext").hidden = !(sc === "garden" && ui && ui.canNext);
  $("dpad").classList.toggle("two", !$("bNext").hidden);
  $("bSel").hidden = sc === "film";
  $("dpad").hidden = sc === "film";        // 영상이 나오는 동안엔 버튼을 다 감춘다 (건너뛸 수 없으니 누를 것이 없다)
  $("selText").textContent =
    sc === "boot" ? "시작하기" :
    sc === "orb" ? "확인하러 가기" :
    sc === "garden" ? (ui && ui.reading && ui.same ? "구슬 설명 닫기" : "이 구슬 열기") :
    sc === "grid" ? "고르기" : "선택";

  // 장면이 바뀌면 누르고 있던 방향은 놓는다
  if (held.size) { held.clear(); document.querySelectorAll("[data-key].down").forEach((b) => b.classList.remove("down")); sendPad(); }
}
setInterval(layout, 400);
layout();

/* ── 영상 진행 — 이름은 제목 자리에, 막대와 시간은 그 아래 ── */
// '12초' · 1분이 넘으면 '1분 05초'
const mmss = (sec) => { sec = Math.max(0, Math.floor(sec || 0)); const m = Math.floor(sec / 60), r = sec % 60;
  return m ? m + "분 " + String(r).padStart(2, "0") + "초" : r + "초"; };
function showFilm(f) {
  const on = !!(f && ui && ui.scene === "film");
  $("prog").hidden = !on;
  if (!on) return;
  $("title").textContent = f.title;
  $("progNow").textContent = mmss(f.t);
  $("progDur").textContent = f.dur ? mmss(f.dur) : "—";
}

/* ── 카메라 + 손 그리기 ── */
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function draw() {
  requestAnimationFrame(draw);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  g.clearRect(0, 0, W, H);

  const live = performance.now() - lastMsg < 2000;
  $("link").classList.toggle("on", live);
  $("linkText").textContent = live ? "작품과 연결됨" : "연결 안 됨";
  $("empty").hidden = live && !!frame;
  if (live && !frame) { $("emptyT").textContent = "카메라를 켜는 중이에요"; $("emptyS").textContent = "조금만 기다려 주세요. 아래 버튼으로도 조작할 수 있어요."; }
  if (ui && performance.now() - uiAt < 1500 && (ui.camOff || ui.camAsk || ui.camDenied)) {
    $("empty").hidden = false;
    $("emptyT").textContent = ui.camAsk ? "모니터에 카메라 허용 창이 떠 있어요" : ui.camDenied ? "카메라가 막혀 있어요" : "카메라가 멈췄어요";
    $("emptyS").textContent = (ui.camAsk ? "모니터 쪽 창에서 '허용'을 눌러 주세요." : "모니터 쪽 작품 화면을 한 번 눌러 주세요.") + " 아래 버튼으로는 계속 조작할 수 있어요.";
  }
  if (!frame) return;

  // 카메라 그림을 비율 그대로 전부 보이게 (손 인식이 보는 범위 그대로) — 남는 양옆은 검정. 거울처럼 좌우를 뒤집는다
  const s = Math.min(W / frameW, H / frameH);
  const dw = frameW * s, dh = frameH * s, dx = (W - dw) / 2, dy = (H - dh) / 2;
  g.save();
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";   // 키울 때 덜 뭉개지게
  g.translate(W, 0); g.scale(-1, 1);
  g.drawImage(frame, W - dx - dw, dy, dw, dh);
  g.restore();
  if (!live) { g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(dx, dy, dw, dh); }

  const st = state || {};
  const hand = live ? st.hand : null;
  const filming = ui && ui.scene === "film" && performance.now() - uiAt < 1500;
  // 카메라가 멈췄으면 그 안내가 먼저 — 모니터 쪽 창을 눌러야 사파리가 카메라를 다시 열어 준다
  const fresh = ui && performance.now() - uiAt < 1500;
  const camMsg = !fresh ? null
    : ui.camAsk ? { kind: "black", text: "모니터에 카메라 허용 창이 떠 있어요", sub: "모니터 쪽 창에서 '허용'을 눌러 주세요" }
    : ui.camDenied ? { kind: "black", text: "카메라가 막혀 있어요", sub: "모니터 쪽 작품 화면을 한 번 누르면 다시 물어요" }
    : ui.camOff ? { kind: "black", text: "카메라가 멈췄어요", sub: "모니터 쪽 작품 화면을 한 번 눌러 주세요" } : null;
  const camOff = !!camMsg;
  showCoach(camMsg ? camMsg
    : live && !filming ? st.coach : null);   // 영상 중엔 손 안내도 띄우지 않는다
  $("hand").classList.toggle("on", !!hand);
  $("handText").textContent = hand ? "손을 찾았어요" : "손을 카메라에 비춰 주세요";
  $("pinch").classList.toggle("on", !!(hand && st.pinch));
  if (!hand) { shownHand = null; return; }

  // 받은 손으로 부드럽게 다가간다 — 손 좌표는 초당 15~30번 오지만 화면은 60~120번 그리므로
  if (!shownHand) shownHand = hand.map((p) => p.slice());
  else for (let i = 0; i < hand.length; i++) {
    shownHand[i][0] += (hand[i][0] - shownHand[i][0]) * 0.5;
    shownHand[i][1] += (hand[i][1] - shownHand[i][1]) * 0.5;
  }
  const hp = shownHand;

  const P = (p) => ({ x: dx + (1 - p[0]) * dw, y: dy + p[1] * dh });
  const k = Math.min(dw, dh * 4 / 3) / 600;
  {
    const a = P(hp[4]), b = P(hp[8]);
    g.save();
    g.strokeStyle = st.pinch ? "#ff2bd6" : "rgba(255,255,255,.45)";
    g.lineWidth = (st.pinch ? 6 : 2) * k;
    if (!st.pinch) g.setLineDash([6 * k, 6 * k]);
    else { g.shadowColor = "#ff2bd6"; g.shadowBlur = 18 * k; }
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    g.restore();
  }
  g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2.5 * k;
  for (const [a, b] of CONN) { const p = P(hp[a]), q = P(hp[b]); g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke(); }
  g.fillStyle = "rgba(255,255,255,.85)";
  for (const p0 of hp) { const p = P(p0); g.beginPath(); g.arc(p.x, p.y, 3 * k, 0, Math.PI * 2); g.fill(); }
  for (const i of [4, 8, 12, 16, 20]) {
    const p = P(hp[i]), big = i === 8, r = (big ? 10 : 6) * k;
    g.save(); g.shadowColor = "rgba(154,90,255,.95)"; g.shadowBlur = (big ? 24 : 12) * k;
    g.fillStyle = big ? "#9a5aff" : "#b48cff"; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill(); g.restore();
  }
  if (st.gauge > 0) {
    const p = P(hp[8]), r = 26 * k;
    g.lineWidth = 6 * k;
    g.strokeStyle = "rgba(255,255,255,.2)";
    g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = "#ff2bd6";
    g.beginPath(); g.arc(p.x, p.y, r, -Math.PI / 2, -Math.PI / 2 + st.gauge * Math.PI * 2); g.stroke();
  }
}
draw();

/* 안내 — 작품 쪽이 손 크기·위치·밝기를 보고 고른 말 (main.js coachFor). 같은 말이면 다시 그리지 않는다 */
let coachShown = "";
function showCoach(c) {
  const key = c ? c.kind + c.text : "";
  if (key === coachShown) return;
  coachShown = key;
  $("coach").hidden = !c;
  if (!c) return;
  $("coach").classList.toggle("ok", c.kind === "ok");
  $("coachIc").textContent = c.kind === "ok" ? "✓" : "!";
  $("coachText").innerHTML = c.text + (c.sub ? "<small>" + c.sub + "</small>" : "");
}
</script>
</body>
</html>
