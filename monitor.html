<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>야광 · 손 인식과 조작</title>
<!--
  아이패드 쪽에 띄워 두는 화면 — 관람객용.
  배치·색은 피그마 '영상캡스톤' 1126:5 (iPad Pro 12.9" 1366×1024) 그대로. 화면 크기가 달라도 이 판을 통째로 줄이거나 키워 맞춘다.
    왼쪽 위: 장면 이름(Interaction1 …)과 한 줄 설명
    왼쪽: 카메라 칸 (회색 #2c2c2c, 흰 테두리) — 안쪽 왼쪽 위 연결·손 상태, 오른쪽 아래 손 인식 안내
    오른쪽: '조작하기' · 십자 버튼 · 큰 버튼 둘 (위 고르기/구슬 열기, 아래 다음 영상으로)
  버튼 색: 쓸 수 있으면 보라 #a54cef, 쓸 수 없으면 회색 #1d1d1d.
  작품(index.html)은 모니터 쪽 사파리 창에, 이 화면은 아이패드 쪽 사파리 창에 연다.
  둘은 BroadcastChannel 로 이어진다 — 같은 사파리의 일반 창끼리만 된다.

  운영자용: 카메라 칸 왼쪽 위 '작품과 연결됨'을 2초 누르고 있으면 카메라 위아래가 뒤집힌다.
-->
<link rel="stylesheet" href="vendor/fonts/roboto-mono.css" />
<!-- 영문 — 작품 사이트와 같은 TT Autonomous Mono (Adobe Fonts). 못 받으면 Roboto Mono 로 -->
<link rel="stylesheet" href="https://use.typekit.net/pgv0czs.css" media="print" onload="this.media='all'" />
<style>
  @font-face { font-family: "Orbit"; src: url("assets/fonts/Orbit-Regular.woff2") format("woff2"); }
  :root {
    --on: #a54cef;           /* 쓸 수 있는 버튼 — 보라 */
    --on-down: #b96bff;      /* 누르는 중 */
    --off: #1d1d1d;          /* 쓸 수 없는 버튼 — 회색 */
    --s: 1;                  /* 판 배율 (JS) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Orbit", "Pretendard", -apple-system, system-ui, sans-serif; word-break: keep-all;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: 0; padding: 0; background: none;
    touch-action: none; cursor: pointer; -webkit-appearance: none; appearance: none; }

  /* 1366×1024 판 — 화면에 맞춰 통째로 줄이거나 키운다 */
  .stage { position: absolute; left: 50%; top: 50%; width: 1366px; height: 1024px;
    transform: translate(-50%, -50%) scale(var(--s)); transform-origin: 50% 50%; }
  .abs { position: absolute; }

  /* ── 왼쪽 위: 장면 이름 · 설명 ── */
  .scene { left: 102px; top: 70px; margin: 0; font-family: "tt-autonomous-mono", "Roboto Mono", ui-monospace, monospace;
    font-weight: 400; font-size: 60px; line-height: 1.4; white-space: nowrap; }
  .scene-sub { left: 101px; top: 172px; margin: 0; font-size: 20px; line-height: 1.4; white-space: nowrap; }
  .scene-sub .time { margin-left: 14px; color: rgba(255,255,255,.6); }
  /* 할 일 아래 — 버튼 안내 (작게) */
  .scene-tip { left: 101px; top: 214px; margin: 0; font-size: 16px; line-height: 1.4; color: rgba(255,255,255,.55); white-space: nowrap; }

  /* ── 손으로 하기 — 장면 이름·할 일 바로 아래, 카메라 칸과 같은 폭(x101~911)의 한 줄 ──
     [이름 칸 | 손동작 셋을 같은 폭으로]. 오른쪽 '조작하기(버튼)'와 왼쪽·오른쪽으로 나뉜다. 지금 하는 손동작은 보라 */
  /* 손동작 카드 셋 (피그마 1126:5 — x92 y250, 267px 씩, #111, 모서리 20, 안쪽 위12·양옆16·아래20) —
     지금 하는 손동작은 색 없이 조금 밝은 회색으로만 */
  .hands { left: 92px; top: 250px; width: 819px; }
  .hands__list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 267px); gap: 9px; }
  .hands__list li { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 20px; border-radius: 20px;
    background: #111; box-shadow: inset 0 0 0 1px transparent; transition: background .2s, box-shadow .2s; }
  .hands__list li b { font-weight: 400; font-size: 20px; line-height: 1.4; color: #fff; }
  .hands__list li small { font-size: 14px; line-height: 1.4; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hands__list li.on { background: #262626; box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }

  /* ── 카메라 칸 (x101 y319, 810×610) ── */
  .cam { left: 101px; top: 360px; width: 810px; height: 610px; padding: 20px;
    background: #2c2c2c; border: 4px solid rgba(255,255,255,.4); border-radius: 30px; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 26px; }

  /* 유리 — 피그마 Windows/Glass (#808080 30% · 흐림 15) */
  .glass { background: rgba(128,128,128,.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }

  .chips { position: absolute; left: 20px; top: 20px; right: 20px; display: flex; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 50px;
    font-size: 14px; line-height: 1.4; white-space: nowrap; }
  .chip i { width: 16px; height: 16px; border-radius: 50%; background: #d9d9d9; }
  .chip.on i { background: #3ee07a; }
  .chip.hand.on i { background: #c38bff; box-shadow: 0 0 8px #a54cef; }
  .chip.pinch { display: none; }
  .chip.pinch.on { display: inline-flex; }
  .chip.pinch.on i { background: #ff2bd6; box-shadow: 0 0 8px #ff2bd6; }
  .chip.charging { background: rgba(165,76,239,.6); }

  .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
    padding: 24px; font-size: 20px; line-height: 1.5; }
  .empty small { font-size: 15px; color: rgba(255,255,255,.65); }

  /* 손 인식 안내 — 카메라 칸 오른쪽 아래 */
  .coach { position: absolute; right: 20px; bottom: 20px;
    display: flex; align-items: center; gap: 8px; padding: 12px 20px;
    border: 1.4px solid rgba(255,255,255,.4); border-radius: 20px;
    animation: coachIn .35s cubic-bezier(.2,.9,.3,1); }
  .coach__ic { flex: none; width: 42px; height: 42px; border-radius: 8px; background: #d9d9d9;
    display: grid; place-items: center; color: var(--on); font-size: 24px; font-weight: 800; }
  .coach.ok .coach__ic { color: #3aa85a; }
  .coach__t { display: flex; flex-direction: column; gap: 4px; font-size: 18px; line-height: 1.4; white-space: nowrap; }
  @keyframes coachIn { from { opacity: 0; transform: translateY(10px); } }

  /* ── 오른쪽: 조작하기 ── */
  /* 오른쪽 판 (x946 y360, 370×610, #141414, 모서리 30) — 위 제목·설명, 가운데 십자, 아래 큰 버튼 둘 */
  .panel { left: 946px; top: 360px; width: 370px; height: 610px; padding: 20px; border-radius: 30px; background: #141414;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .ctl-head { text-align: center; }
  .ctl-h { margin: 0; font-size: 24px; line-height: 1.4; }
  .ctl-p { margin: 12px 0 0; font-size: 16px; line-height: 1.5; white-space: pre-line; color: rgba(255,255,255,.85); }
  /* 버튼 공통 — 보라 + 안쪽 흰 빛, 쓸 수 없으면 회색 */
  .btn { display: flex; align-items: center; justify-content: center;
    background: var(--on); color: #fff;
    box-shadow: inset 0 0 30px rgba(255,255,255,.4);
    filter: drop-shadow(0 0 2px rgba(255,255,255,.25));
    transition: transform .1s ease, background .15s ease; }
  .btn.down { background: var(--on-down); transform: scale(.95); }
  .btn.off { background: var(--off); color: rgba(255,255,255,.28); box-shadow: inset 0 0 30px rgba(76,76,76,.4); pointer-events: none; }

  /* 십자 (위 1101,483 · 왼 1018,554 · 오른 1185,554 · 아래 1101,627 · 66px) */
  /* 십자 (피그마 233×210 안에 66px 버튼 넷) */
  .dpad { display: grid; grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(3, 66px); column-gap: 11px; row-gap: 6px; }
  .key { width: 66px; height: 66px; border-radius: 10px; }
  .k-up    { grid-area: 1 / 2; }
  .k-left  { grid-area: 2 / 1; }
  .k-right { grid-area: 2 / 3; }
  .k-down  { grid-area: 3 / 2; }
  .key svg { width: 48px; height: 48px; overflow: visible; }
  .k-up svg { transform: rotate(180deg); } .k-left svg { transform: rotate(90deg); } .k-right svg { transform: rotate(-90deg); }
  /* 아이콘 — 피그마 picon:south (켜짐: 보라 두 겹 · 꺼짐: 검정 두 겹) */
  /* 세모 — 좌우 대칭, 무게중심이 버튼 한가운데(24,24). 겉은 연보라 두꺼운 테두리, 안은 진보라 (피그마 아이콘과 같은 두 겹) */
  .key .i1 { fill: #6d00c6; stroke: #9e37f3; stroke-width: 10; stroke-linejoin: round; }
  .key .i2 { fill: #7500d4; stroke: #7500d4; stroke-width: 3; stroke-linejoin: round; }
  .key.off .i1 { fill: #171717; stroke: #333; }
  .key.off .i2 { fill: #1c1c1c; stroke: #1c1c1c; }

  /* 큰 버튼 (x1004 · 258×63 · y784 / y863) */
  /* 큰 버튼 둘 — 판 폭 가득, 사이 16 */
  .acts { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .big { width: 100%; height: 63px; border-radius: 20px; font-size: 24px; line-height: 1.4; white-space: nowrap; }
  /* 다음 영상으로 — 고르기(보라)와 다른 색: 작품의 강조 마젠타 */
  #bNext { background: #e33ccb; }
  #bNext.down { background: #f45bd9; }
  #bNext.off { background: var(--off); }
</style>
</head>
<body>
<div class="stage" id="stage">

  <h1 class="abs scene" id="scene">Yagwang</h1>
  <p class="abs scene-sub" id="sub">손을 카메라에 비추거나 버튼을 누르십시오.</p>

  <!-- 손으로 하기 — 이 장면에서 손으로 넘어가는 방법. 지금 하고 있는 손동작 줄이 밝아진다 -->
  <section class="abs hands" id="hands">
    <ol class="hands__list" id="handsList"></ol>
  </section>

  <section class="abs cam">
    <canvas id="view"></canvas>
    <div class="empty" id="empty">
      <b id="emptyT">작품 화면을 기다리는 중이에요</b>
      <small id="emptyS">같은 사파리의 다른 창에서 작품을 열어 두세요.<br />작품 쪽 카메라가 켜지면 여기 크게 보여요.</small>
    </div>
    <div class="chips">
      <span class="chip glass" id="link"><i></i><span id="linkText">연결 안 됨</span></span>
      <span class="chip glass hand" id="hand"><i></i><span id="handText">손을 카메라에 비춰 주세요</span></span>
      <span class="chip glass pinch" id="pinch"><i></i><span>집었어요</span></span>
    </div>
    <!-- 손 인식 안내 — 왜 잘 안 되는지 (너무 가까움·멂·어두움·화면 끝·카메라 멈춤) -->
    <div class="coach glass" id="coach" hidden><span class="coach__ic" id="coachIc">!</span><span class="coach__t" id="coachText"></span></div>
  </section>

  <section class="abs panel" id="ctl">
    <div class="ctl-head">
      <p class="ctl-h">손이 안되면 버튼으로</p>
      <p class="ctl-p" id="hint">손으로, 또는 버튼으로 조작해요</p>
    </div>
    <div class="dpad">
      <button class="btn key k-up" data-key="up" type="button" aria-label="앞으로"><svg viewBox="0 0 48 48"><path class="i1" d="M13 19.5H35L24 33Z"/><path class="i2" d="M13 19.5H35L24 33Z"/></svg></button>
      <button class="btn key k-left" data-key="left" type="button" aria-label="왼쪽"><svg viewBox="0 0 48 48"><path class="i1" d="M13 19.5H35L24 33Z"/><path class="i2" d="M13 19.5H35L24 33Z"/></svg></button>
      <button class="btn key k-right" data-key="right" type="button" aria-label="오른쪽"><svg viewBox="0 0 48 48"><path class="i1" d="M13 19.5H35L24 33Z"/><path class="i2" d="M13 19.5H35L24 33Z"/></svg></button>
      <button class="btn key k-down" data-key="down" type="button" aria-label="뒤로"><svg viewBox="0 0 48 48"><path class="i1" d="M13 19.5H35L24 33Z"/><path class="i2" d="M13 19.5H35L24 33Z"/></svg></button>
    </div>
    <div class="acts">
      <button class="btn big" id="bSel" type="button"><span id="selText">선택</span></button>
      <button class="btn big off" id="bNext" type="button">다음 영상으로</button>
    </div>
  </section>

</div>

<script>
const ch = new BroadcastChannel("yk-monitor");
const cv = document.getElementById("view");
const g = cv.getContext("2d");
const $ = (id) => document.getElementById(id);

/* 1366×1024 판을 화면에 맞춘다 */
let stageScale = 1;
function fit() {
  stageScale = Math.min(innerWidth / 1366, innerHeight / 1024);
  document.documentElement.style.setProperty("--s", stageScale);
}
fit(); addEventListener("resize", fit);

let frame = null, frameW = 4, frameH = 3;     // 마지막 카메라 그림
let state = null, ui = null, lastMsg = 0, uiAt = 0;
let shownHand = null;                         // 화면에 그리는 손 — 받은 손을 부드럽게 따라간다

ch.onmessage = async (e) => {
  const m = e.data || {};
  lastMsg = performance.now();
  if (m.t === "frame" && m.blob) {
    try {
      const bmp = await createImageBitmap(m.blob);
      if (frame && frame.close) frame.close();
      frame = bmp; frameW = m.w; frameH = m.h;
    } catch {}
  } else if (m.t === "hand") { state = m; lightHands(typeof m.row === "number" ? m.row : -1); }
  else if (m.t === "ui") { ui = m; uiAt = performance.now(); layout(); showFilm(m.film); }
};

// 작품 쪽에 '여기 화면이 있다'고 알린다 — 그래야 그림을 보내기 시작한다
const hello = () => ch.postMessage({ t: "hello" });
hello(); setInterval(hello, 1000);

// 아이패드 화면이 꺼지지 않게
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {} }
keepAwake();
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

/* ── 전체 화면 ──
   사파리 주소창·탭 줄을 없앤다. 브라우저 규칙상 화면을 한 번 눌러야 들어간다 — 아무 데나 처음 누르면 들어가고,
   빠져나오면 다음에 누를 때 다시 들어간다.
   (홈 화면 웹앱으로 열면 사파리와 저장 공간이 따로라 작품 창과 이어지지 않아 카메라가 안 보인다 — 사파리 + 전체 화면으로 쓴다) */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function goFullscreen() {
  if (fsEl()) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try { const r = req.call(el); if (r && r.catch) r.catch(() => {}); } catch {}
}
window.addEventListener("pointerdown", goFullscreen, true);
window.addEventListener("touchend", goFullscreen, true);

// 두 번 눌러 확대·길게 눌러 메뉴 같은 아이패드 기본 동작을 막는다
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ── 방향키 — 누르고 있는 동안 움직인다 ──
   구슬 화면에서는 ◀ 가 '다시 고르기' (작품 쪽이 구슬 화면의 ◀ 를 그렇게 받는다) */
const held = new Set();
const sendPad = () => ch.postMessage({ t: "pad", keys: [...held] });
setInterval(() => { if (held.size) sendPad(); }, 400);     // 놓는 신호를 놓쳐도 작품 쪽이 알아서 멈추게
document.querySelectorAll("[data-key]").forEach((b) => {
  const k = b.dataset.key;
  const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} held.add(k); b.classList.add("down"); sendPad(); };
  const off = () => { if (!held.has(k)) return; held.delete(k); b.classList.remove("down"); sendPad(); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("lostpointercapture", off);
});
// 한 번 누르면 되는 버튼 — 손가락이 닿는 순간 반응한다
function tap(el, fn) {
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.classList.add("down"); fn(); });
  const up = () => el.classList.remove("down");
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
}
tap($("bSel"), () => ch.postMessage({ t: "select" }));
tap($("bNext"), () => ch.postMessage({ t: "next" }));

/* 운영자용 — '작품과 연결됨'을 2초 누르면 카메라 위아래 뒤집기 */
{
  const el = $("link"); let t = 0;
  el.addEventListener("pointerdown", () => { el.classList.add("charging"); t = setTimeout(() => {
    if (window.__local && window.__local.ok && window.__local.rotate) window.__local.rotate();   // 이 창 카메라를 뒤집는다
    else ch.postMessage({ t: "rotate" });                                                     // 작품 창 카메라를 뒤집는다
    el.classList.remove("charging");
  }, 2000); });
  const cancel = () => { clearTimeout(t); el.classList.remove("charging"); };
  el.addEventListener("pointerup", cancel); el.addEventListener("pointercancel", cancel); el.addEventListener("pointerleave", cancel);
}

/* ── 장면마다 이름 · 설명 · 켜지는 버튼 ──
   작품에서 장면을 못 받고 있으면(예전 작품 화면 등) 'any' — 방향 네 개 + 선택을 다 켠다. */
/* 손으로 하기 — [아이콘, 손동작, 결과] (줄 순서는 작품 쪽 guideRow 와 같다) */
const HANDS = {
  any:    [["✋", "조작 시작", "손을 카메라에 비추기"]],
  boot:   [["✋", "시작", "손을 카메라에 잠시 비추기"]],
  grid:   [["↔", "고리 돌리기", "손을 화면 양 끝으로"],
           ["✋", "고르기", "가운데 파편에 손 2초"],
           ["🤏", "빨리 고르기", "엄지와 검지 모아 집기"]],
  orb:    [["✋", "확인하러 가기", "버튼에 손 올려 두기"],

  });
  try { model = await HandLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { model = await HandLandmarker.createFromOptions(fs, opts("CPU")); }
}

// 밝기 (작품 창의 '너무 어두워요' 안내에 쓴다)
const mc = document.createElement("canvas"); mc.width = 32; mc.height = 24;
const mx = mc.getContext("2d", { willReadFrequently: true });
let meterAt = 0;
// 작품 창 손 인식 상자에 띄울 작은 그림 (초당 8장)
const fc = document.createElement("canvas"), fx = fc.getContext("2d");
let frameAt = 0, frameBusy = false, lastT = -1;

function tick() {
  requestAnimationFrame(tick);
  if (!L.ok || video.readyState < 2 || video.currentTime === lastT) return;
  lastT = video.currentTime;
  const src = upright();                       // 세로로 들어오면 돌려서 가로로
  L.src = src;
  if (!model) return;                          // 손 모델을 받는 동안에도 카메라는 바로 세워서 보여 준다
  // 영상이 나오는 동안엔 손 인식을 쉰다 — 영상 재생과 그래픽 칩을 나눠 쓰지 않게 (끊김 줄이기)
  if (typeof ui !== "undefined" && ui && ui.scene === "film" && performance.now() - uiAt < 1500) {
    L.lms = null;
    // 작품 창이 '아이패드가 사라졌다'고 여겨 카메라를 가져가지 않게, 손 없음만 가끔 알린다
    if (performance.now() - (L.beatAt || 0) > 400) { L.beatAt = performance.now(); ch.postMessage({ t: "lms", lms: null, w: src.videoWidth, h: src.videoHeight, mean: L.mean }); }
    return;
  }
  const now = performance.now();
  let res = null;
  try { res = model.detectForVideo(src, now); } catch {}
  const lms = (res && res.landmarks && res.landmarks[0]) || null;
  L.lms = lms;
  if (now - meterAt > 500) {
    meterAt = now;
    try {
      mx.drawImage(src, 0, 0, 32, 24);
      const d = mx.getImageData(0, 0, 32, 24).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      L.mean = sum / (d.length / 4);
    } catch {}
  }
  ch.postMessage({ t: "lms", lms: lms ? lms.map((p) => [p.x, p.y, p.z || 0]) : null,
    w: src.videoWidth, h: src.videoHeight, mean: L.mean });
  if (!frameBusy && now - frameAt > 125) {
    frameAt = now;
    const w = 320, h = Math.round((320 * src.videoHeight) / src.videoWidth);
    if (fc.width !== w || fc.height !== h) { fc.width = w; fc.height = h; }
    fx.drawImage(src, 0, 0, w, h);
    frameBusy = true;
    fc.toBlob((b) => { frameBusy = false; if (b) ch.postMessage({ t: "rframe", blob: b, w, h }); }, "image/jpeg", 0.6);
  }
}

startCam();
requestAnimationFrame(tick);
loadModel().catch(() => { L.err = L.err || "model"; });
</script>
</body>
</html>
